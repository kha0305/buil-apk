name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Inline JS libraries into index.html
        run: |
          curl -sSL -o /tmp/xlsx.js https://cdn.sheetjs.com/xlsx-0.18.5/package/dist/xlsx.full.min.js
          curl -sSL -o /tmp/h2c.js https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js
          python3 - <<'EOF'
          html = open('www/index.html', encoding='utf-8').read()
          xlsx = open('/tmp/xlsx.js', encoding='utf-8').read()
          h2c = open('/tmp/h2c.js', encoding='utf-8').read()
          assert '<!--INJECT_SHEETJS-->' in html and '<!--INJECT_HTML2CANVAS-->' in html
          html = html.replace('<!--INJECT_SHEETJS-->', '<script>\n' + xlsx + '\n</script>')
          html = html.replace('<!--INJECT_HTML2CANVAS-->', '<script>\n' + h2c + '\n</script>')
          open('www/index.html', 'w', encoding='utf-8').write(html)
          print('index.html bytes:', len(html.encode('utf-8')))
          EOF

      - name: Add Android platform
        run: npx cap add android

      - name: Set Vietnamese app name
        run: sed -i 's/>Nhat Ky Xe</>Nhật ký xe</g' android/app/src/main/res/values/strings.xml

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Install app icons
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "android/app/src/main/res/mipmap-$d"
            base64 -d "assets/icon/mipmap-$d/ic_launcher.png.b64" > "android/app/src/main/res/mipmap-$d/ic_launcher.png"
            base64 -d "assets/icon/mipmap-$d/ic_launcher_round.png" > "android/app/src/main/res/mipmap-$d/ic_launcher_round.png"
          done
          ls android/app/src/main/res/mipmap-xxxhdpi/

      - name: Prepare signing keystore
        run: base64 -d debug.keystore.b64 > "$GITHUB_WORKSPACE/debug.keystore"

      - name: Build debug APK
        run: |
          cd android && chmod +x gradlew && ./gradlew assembleDebug \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/debug.keystore" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nhat-ky-xe-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
