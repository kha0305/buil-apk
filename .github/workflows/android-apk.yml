# Build APK Android cho app Ghi chú (Tauri Mobile 2.12)
#
# Lấy mẫu từ 3 repo đã thử thật (xem docs/reused-workflows.md):
# - EasyTier (.github/workflows/mobile.yml): setup-android@v3 + NDK 26 + 4 target
#   Rust Android + `tauri android build --apk --split-per-abi`, APK ở
#   src-tauri/gen/android/app/build/outputs/apk/*/release/*.apk
# - Blinko (.github/workflows/app-release.yml): ký release bằng keystore giải mã
#   từ secret, versionCode = major*1_000_000 + minor*1_000 + patch
# - kha0305/buil-apk (.github/workflows/build-apk.yml, Capacitor): chỉ tham khảo
#   cấu trúc chung (Node 22, Java 21, upload artifact); các bước cap add/sync,
#   APK debug KHÔNG dùng cho Tauri.
#
# Không copy code nghiệp vụ của repo nào. Chưa chạy thật trên GitHub Actions —
# cần kha push repo lên GitHub rồi bấm Run workflow để kiểm chứng.
name: Build APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - ".github/workflows/android-apk.yml"

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cài Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cài Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cài Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: "build-tools;34.0.0 platform-tools platforms;android-34 ndk;26.0.10792818"

      - name: Cài Rust + 4 target Android
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Cài dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Khởi tạo Android (lần đầu)
        run: |
          if [ ! -d src-tauri/gen/android ]; then
            npx tauri android init
          fi

      # Ký bản release bằng keystore cố định (kha tạo 14/11/2026, giữ file
      # .keystore + mật khẩu cẩn thận — mất là không cập nhật đè app được nữa).
      # Keystore nằm trong GitHub Secrets, KHÔNG commit vào repo.
      # Cách ký theo tài liệu Tauri + mẫu Blinko: giải mã keystore vào
      # src-tauri/gen/android/keystore.jks rồi ghi keystore.properties.
      # CHÚ Ý (rút từ lần chạy #6, run 43588855849, 14/11/2026): chỉ ghi
      # keystore.properties là CHƯA đủ — file build.gradle.kts do
      # `tauri android init` sinh ra không tự nối signing config, nên bản
      # release vẫn ra file app-universal-release-unsigned.apk và bước đổi tên
      # chết đúng lỗi như lần chạy #1. Phải chạy thêm script
      # scripts/patch-android-signing.py (bước ngay dưới) để chèn khối
      # signingConfigs + signingConfig vào build.gradle.kts thì Gradle mới ký.
      # Secrets doc qua env (khong chen thang vao lenh): mat khau co ky tu $ ` !
      # se khong bi bash hieu nham (heredoc <<EOF khong co ngoac don o ban truoc
      # se lam bien dang mat khau dang do), va `keytool -list` kiem tra ngay
      # keystore co mo duoc khong thay vi doi toi buoc build moi chet kho hieu.
      - name: Giải mã keystore ký release
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 -d > src-tauri/gen/android/keystore.jks
          test -s src-tauri/gen/android/keystore.jks || { echo "Keystore giai ma ra file rong — kiem tra lai secret ANDROID_KEYSTORE_BASE64"; exit 1; }
          keytool -list -keystore src-tauri/gen/android/keystore.jks -storepass "$KEYSTORE_PASS" -alias "$KEY_ALIAS" >/dev/null || { echo "Khong mo duoc keystore — sai mat khau kho hoac sai alias, kiem tra lai secrets"; exit 1; }
          {
            echo "storeFile=$GITHUB_WORKSPACE/src-tauri/gen/android/keystore.jks"
            echo "storePassword=$KEYSTORE_PASS"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASS"
          } > src-tauri/gen/android/keystore.properties

      - name: Bật ký release trong Gradle
        env:
          TAURI_VERSION_CODE: ${{ github.run_number }}
        run: python3 scripts/patch-android-signing.py

      - name: Build APK
        run: npx tauri android build --apk
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.0.10792818

      - name: Đổi tên APK universal
        run: cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk ghi-chu-0.1.0-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ghi-chu-apk
          path: ghi-chu-0.1.0-release.apk
