<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-visual"
    />
    <title>Ghi chú</title>
    <!-- Màn chờ inline: hiện ngay khi HTML được parse, trước cả khi bundle
        JS tải xong (kha báo chớp trắng lúc khởi động, 15/11). Toàn bộ style
        viết ở đây, không phụ thuộc file CSS ngoài; React gỡ #loading sau
        lần render đầu (xem App.tsx). Vòng xoay chỉ dùng transform (GPU). -->
    <style>
      html,
      body {
        background: #f7f1e5;
      }
      #loading {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: #f7f1e5;
      }
      #loading .spin {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 2px solid rgba(179, 38, 30, 0.18);
        border-top-color: #b3261e;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <div id="loading" aria-hidden="true">
      <!-- Icon sổ vàng của app vẽ bằng SVG inline (không load file ngoài):
          tờ giấy vàng kẻ dòng xanh + bút chì đỏ chéo, nền kem bo góc. -->
      <svg
        width="96"
        height="96"
        viewBox="0 0 96 96"
        fill="none"
        aria-hidden="true"
      >
        <rect x="6" y="6" width="84" height="84" rx="18" fill="#fffdf7" />
        <rect x="22" y="18" width="52" height="60" rx="4" fill="#fdf0b8" />
        <path d="M29 33h38M29 43h38M29 53h38" stroke="#8fb8d8" stroke-width="2" stroke-linecap="round" />
        <g transform="rotate(38 64 50)">
          <rect x="60" y="22" width="9" height="6" rx="2" fill="#d45a4a" />
          <rect x="60" y="28" width="9" height="34" rx="2" fill="#b3261e" />
          <polygon points="60,62 69,62 64.5,72" fill="#f0c080" />
          <polygon points="63,68 66,68 64.5,72" fill="#2b2620" />
        </g>
      </svg>
      <div class="spin"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
